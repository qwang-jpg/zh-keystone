name: Deploy to SiteGround Staging

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'functions.php'
      - 'index.php'
      - 'style.css'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/deploy-staging.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/.vite/manifest.json
          test -f functions.php
          test -f index.php
          test -f style.css

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SITEGROUND_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p ${{ secrets.SITEGROUND_SSH_PORT }} ${{ secrets.SITEGROUND_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy theme files to staging
        run: |
          rsync -avz --delete \
            --exclude ".DS_Store" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gitignore" \
            --exclude "node_modules" \
            --exclude "src" \
            --exclude "public" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "vite.config.js" \
            --exclude "postcss.config.js" \
            --exclude "tailwind.config.js" \
            --exclude "jsconfig.json" \
            --exclude "index.html" \
            --exclude "CLAUDE.md" \
            -e "ssh -p ${{ secrets.SITEGROUND_SSH_PORT }}" \
            ./ \
            ${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}:${{ secrets.SITEGROUND_DEPLOY_PATH }}
